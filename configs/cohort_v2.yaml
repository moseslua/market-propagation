# Cohort and candidate-universe freeze, v2.
#
# The v1 cohort (`configs/cohort.yaml`) and the pipeline configuration
# (`configs/external_history_v1.yaml`) stay frozen and unchanged. This file declares
# what the v2 run resolves that v1 left to the code: which series are policy series,
# how a release's candidate universe is selected, and which contract predicate a
# candidate must state before it can be a receiver or a donor.
#
# Nothing here is selected by post-event activity. Every rule below is a function of
# a listing interval that is recorded before the release, a declared series name, and
# text the venue published with the contract.

config_version: cohort_v2
scope: >-
  Two release arms, never pooled: the ten frozen 2025 releases (`core_2025h1`, the
  retrospective arm every existing result is measured on) and the prospective arm
  (`forward_2026h2`) declared in `configs/cohort_forward.yaml`. Beside them, the four
  declared Kalshi policy series and the pre-event rule that decides which contracts
  each release of either arm is measured against.

releases:
  # The release cohort is the v1 cohort, unchanged. It is named here rather than
  # copied so the two cannot drift apart, and so a v2 run cannot quietly reselect it.
  #
  # This is the retrospective arm. It stays the cohort every existing result is
  # measured on, and it stays reported as blocked for want of rule-vintage evidence.
  # The prospective arm is declared beside it in `arms:` below and is never pooled
  # with it.
  arm: retrospective
  file: configs/cohort.yaml
  cohort_id: core_2025h1
  event_count: 10
  families:
    cpi: 5
    employment: 5
  selected_without_reference_to_outcomes: true

arms:
  # The study has two arms, and they are declared here so that neither can be read
  # as the other. Each arm is named by file and is never copied into this one, so a
  # run cannot reselect either arm, and a reader can tell which arm a result belongs
  # to from the cohort id alone.
  #
  # They are not versions of one arm and they are not a time split of one sample.
  # They differ in what can be certified about them: a rule capture records the
  # instant the serving system states, and an interval that opens at that instant
  # cannot certify a window that closed before it. The retrospective arm's windows
  # all closed before any capture exists, which is why that arm is blocked and why
  # the forward arm exists.
  pooling_permitted: false
  events_are_never_merged: true
  event_ids_are_namespaced_by_year: true
  a_result_names_its_arm: true
  members:
    - arm: retrospective
      file: configs/cohort.yaml
      cohort_id: core_2025h1
      role: the_frozen_2025_cohort
      event_count: 10
      event_id_prefixes:
        - cpi_2025_
        - empsit_2025_
      rule_vintage_certifiable: false
      status: blocked_pending_rule_vintage_evidence
      status_is_reported_not_inferred: true
      why: >-
        every candidate contract's window closed before any dated rule capture exists,
        so no attested rule record can be in force across it and the primary graph
        refuses every edge. This arm is retained and reported as blocked; it is never
        deleted and never rewritten. See `rule_vintage` below.
    - arm: forward
      file: configs/cohort_forward.yaml
      cohort_id: forward_2026h2
      role: the_prospective_arm_extended_by_a_declared_calendar_rule
      event_count: 6
      event_count_is_a_snapshot: true
      event_id_prefixes:
        - cpi_2026_
        - empsit_2026_
      extension_rule: next_scheduled_release_per_family
      extension_rule_authority: configs/cohort_forward.yaml
      rule_vintage_certifiable: true
      status: declared_pending_each_release_publishing
      status_is_reported_not_inferred: true
      why: >-
        its releases are in the future, so a capture taken before each one can open its
        interval before the window it certifies. Nothing about outcome, activity or
        contract liveness selects its membership; the rule and its peeking hazard are
        stated in `configs/cohort_forward.yaml` and in
        `reports/preregistration_v2.md`.
      not_in_any_current_result: true
      not_in_any_current_result_meaning: >-
        no release in this arm has published, and no release row exists for one, so no
        panel, graph, forecast or estimate in this repository contains a row from it.
  # What each arm may not be used for, stated so a reader does not have to infer it.
  cross_arm_uses_forbidden:
    - pooling the two arms into one estimate or one denominator
    - using the forward arm to add releases to the retrospective arm's sample
    - reading an unblocked forward arm as unblocking the retrospective arm's claim
    - reporting a forward-arm result as the retrospective arm's result, or the reverse
  cross_arm_denominator_rule: >-
    each arm is its own denominator. An arm's declared grid is reported with that arm's
    cohort id, and a pooled count is reported as an error rather than as a total.

# The declared policy series. `series_of` reads the leading alphabetic run of a
# ticker, so a series name is matched exactly and a substring match on a ticker that
# merely contains the letters is not a match. All four are declared; the v1 extract
# selected only three of them, because a `LIKE 'FED-%'` test drops the sibling
# `FEDDECISION` series, which is a declared policy series in its own right.
policy_series:
  - FED
  - FEDDECISION
  - KXFED
  - KXFEDDECISION
series_parser: market_propagation.ingest.audit.series_of

venues:
  # Only the venue whose transactions the sealed archive carries is a candidate
  # venue. A venue with no transaction archive contributes no candidate.
  kalshi:
    transaction_archive: data/external/kalshi-trades/trades-*.parquet
    market_metadata_snapshot: data/external/kalshi-trades/markets-*.parquet
    metadata_snapshot_is_availability_evidence: false

candidate_universe:
  # The universe is declared per release, before the release, and it is the
  # denominator: every declared pair keeps its rows even when it never traded.
  selection: per_release_declared_listing_grid
  candidate_rule: >-
    a contract is a candidate for one release when its series is one of the four
    declared series and its own recorded listing interval covers the release instant
  activity_used_to_select: false
  missing_cells_are_reported: true
  # The metadata snapshot dates the market. It is not evidence that the contract was
  # tradable at the release, and it is not rule-vintage evidence either.
  metadata_snapshot_dates_the_market_only: true

receivers:
  # A receiver is a candidate of that release whose stated payout is a policy-rate
  # payoff the study can read. The predicate is read from the venue's published
  # contract text, not from the shape of a ticker.
  predicate_parser: market_propagation.ingest.policy_predicates
  require_readable_predicate: true
  declared_receivers_reach_the_forecast_builder: true
  # A receiver that never traded keeps its masked row; it is a missing observation
  # and not an absent row.
  quiet_receivers_keep_their_rows: true

donors:
  # A donor is a candidate at the decision date immediately preceding the receiver's
  # own, on the declared calendar, stating an identical predicate.
  calendar_file: configs/neighbor_graph_v2.yaml
  relation: economic_exposure
  immediate_predecessor_only: true
  same_meeting_siblings_are_not_donors: true
  near_match_substitution_forbidden: true
  rule_vintage_required: true

rule_vintage:
  # No attested historical rule vintage exists for any candidate contract on this
  # archive. `reports/contract_rule_registry.json` is a specification document and
  # carries no per-contract rule record, so this requirement is unmet for every
  # contract and the primary graph refuses every edge.
  status: absent
  evidence_source: reports/contract_rule_registry.json
  evidence_source_records_rule_versions: false
  settlement_outcomes_are_not_rule_evidence: true
  current_rule_text_is_not_historical_rule_evidence: true
  listing_window_is_not_a_rule_bound: true

blocked_claims:
  # Stated here so a reader of this file knows what the v2 freeze does not permit.
  - id: primary_absorption
    status: permitted_pending_panel
    why: >-
      the absorption rung needs the masked response panel, which the declared grid
      produces; it does not need the graph
  - id: conditional_predictive_propagation
    status: blocked
    why: >-
      no attested historical rule vintage exists for any candidate contract, so no
      donor is admissible under the declared rule requirement
  - id: rule_calibration
    status: measured
    why: >-
      the transaction-tape calibration ran at 200 repetitions per primary scenario
      over simulated tapes through the same graph, observation, feature, fitting,
      tuning, paired-uncertainty and promotion code as real data. Verdict `pass`: all
      ten declared null scenarios are estimable and every one promoted in 0 of 200
      repetitions, a one-sided upper bound of 0.02614 at simultaneous level 0.995
      against the 0.05 ceiling, and the recovery scenario promoted in 196 of 200 with a
      one-sided lower bound of 0.9548 against the 0.80 target. Two declared nulls
      previously emitted no comparison row because of defects in their own declarations
      (`spread_only` carried a declared zero shock into the news control as a null;
      `resolution_pause` declared a halt that covered its entire primary window); both
      are fixed, and the change is recorded under `not_estimable_no_longer`. Rates,
      certificate and registry are recorded in
      configs/study_v2.yaml under `calibration`. This does not unblock the claim
      above: the calibration measures the rule on a synthetic process and says
      nothing about any real contract's rule vintage.
