audit:
  gate: G0
  cohort_size: 10
  cohort_source: default_ten_event_cohort_in_ingest_audit
  cohort_selection_rules:
    - candidates come from the series' own historical market listing
    - eligibility is decided by the contract's own open_time and close_time
    - post_event_volume_filtering: false
    - liquidity_is_reported_not_filtered: true
  window_minutes_before: 120
  window_minutes_after: 120
  requested_candle_intervals_minutes: [60, 1]
  primary_series:
    cpi: ["KXCPI", "KXCPIYOY"]
    empsit: ["KXPAYROLLS"]
  downstream_series_discovery:
    mode: keyword_search_over_exchange_series_listing
    cpi_terms: ["inflation", "cpi"]
    empsit_terms: ["payroll", "jobs", "unemployment", "employment"]
    guessed_tickers: false
  bounds:
    events: 10
    max_contracts_per_event: 40
    max_candle_contracts_per_event: 4
    max_pages_per_listing: 8
    trade_page_limit: 1000
  outputs:
    - coverage.json
    - raw_hashes.json
    - event_card.json
    - series_discovery.json
  honest_failure_modes:
    - >-
      If narrow historical discovery cannot be completed within the
      endpoint-supported filters, G0 fails honestly. The audit reports blocked
      events and a status of blocked or partial rather than reporting an empty
      successful study.
    - >-
      A post-release window with no quotes is classified against the contract's own
      close_time; a closed market is recorded as a closed_market exclusion, not as
      an observation of no movement.
    - >-
      Candle holes invalidate reconstruction for the affected window and are
      reported per contract, and are never forward filled.
