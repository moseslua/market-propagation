# The forward arm of the study cohort: the next three scheduled CPI and the next
# three scheduled Employment Situation releases, October through December 2026.
#
# This is a second arm, not a new version of the first one. `configs/cohort.yaml`
# is the retrospective arm (`core_2025h1`) and stays frozen and unchanged; it
# remains the arm every result reported so far is measured on, and it remains the
# arm reported as blocked for want of rule-vintage evidence. This file declares the
# prospective arm beside it, and `configs/cohort_v2.yaml` names both under `arms:`
# so neither can be read as the other.
#
# Dates come from the official BLS release schedules, read 2026-09-17: the monthly
# selected-release calendars for October, November and December 2026, and the
# per-release schedule tables for the Consumer Price Index and the Employment
# Situation. Each monthly calendar states that all times on it are Eastern Time.
# The by-release tables carry only the next three reference months, because the BLS
# schedule runs about three months ahead and is updated as needed. That horizon is
# why this arm cannot be declared complete up front and is extended by the declared
# rule below instead.
#
# scheduled_at is the scheduled release time in the source calendar timezone.
# scheduled_at_utc is the same instant after America/New_York conversion.
# No eligible market ID is recorded here. Candidate series are leads only.
# PublicIngestion owns all market and endpoint discovery.

cohort:
  cohort_id: forward_2026h2
  arm: forward
  counterpart_arm_file: configs/cohort.yaml
  counterpart_arm_id: core_2025h1
  description: >-
    the next three scheduled CPI and the next three scheduled Employment Situation
    releases, October through December 2026, extended by the declared calendar rule
  family_separation: cpi_and_employment_estimated_separately
  event_count: 6
  event_count_by_family:
    cpi: 3
    employment: 3
  event_count_is_a_snapshot_on: "2026-09-17"
  event_count_grows_by_the_extension_rule: true
  selection_basis: >-
    next_scheduled_release_per_family_from_the_official_bls_release_calendar_selected_before_publication
  selected_without_reference_to_outcomes: true
  selection_is_fixed_before_the_release_publishes: true
  selection_reads_only: official_published_bls_release_calendar
  selection_never_reads:
    - whether any contract was live at the release instant
    - whether any contract traded around the release instant
    - whether any contract repriced after the release instant
    - the release's own first-print actual, revision or surprise
    - whether a point-in-time expectation source exists for the release
  no_post_publication_addition_or_removal: true
  no_post_publication_addition_or_removal_meaning: >-
    a release appended by the rule below is never removed once the arm has been run
    against it. A release that turns out to have no eligible contract, no live
    donor and no expectation source stays in the arm and is reported with the reason
    it contributed no row. Dropping it would select the arm on the outcome that
    turned out to be inconvenient.
  declared_windows_file: configs/event_windows_v2.yaml
  declared_candidate_universe_file: configs/cohort_v2.yaml
  policy_series_authority: configs/cohort_v2.yaml
  rule_evidence_required: true
  rule_evidence_authority: configs/neighbor_graph_v2.yaml
  verified_eligible_market_ids: []
  verified_eligible_market_id_count: 0
  cross_venue_verified_matches: []
  cross_venue_match_status: unverified_polymarket_access_timed_out
  paid_spend_usd: 0

# The mechanical rule that extends the arm. It is declared here, in the file it
# extends, and repeated in `reports/preregistration_v2.md`. It is a function of a
# published calendar and nothing else.
extension_rule:
  id: next_scheduled_release_per_family
  authority: >-
    the official BLS release schedules only: the by-release schedule table for the
    family, https://www.bls.gov/schedule/news_release/cpi.htm and
    https://www.bls.gov/schedule/news_release/empsit.htm, and the monthly selected
    release calendars under https://www.bls.gov/schedule/{year}/{month:02d}_sched_list.htm
  step_1: >-
    Read the family's own by-release schedule table and its monthly selected-release
    calendar.
  step_2: >-
    Take that family's earliest scheduled release whose instant is not already
    declared in this file's `events` list. One release per family is appended per
    round, so the two families advance independently and neither waits on the other.
  step_3: >-
    Record it with the calendar's own date, the calendar's own stated release time
    converted from America/New_York to UTC, the reference period the calendar names,
    the calendar URL it was read from, and the weekday the calendar states.
  step_4: >-
    Leave `initial_release_url_verified: false` and `observed_publication_time: null`
    until the release has published and its archive page has been read. The arm's
    release rows are built by the publication cadence, not declared in advance.
  step_5: >-
    Run the measurement for the appended release only after its instant has passed
    and its row exists, so no row of this arm can be built from a release that had
    not yet happened.
  horizon_limitation: >-
    the BLS schedule covers roughly the next three months and is updated as needed,
    so an append round can name only the releases BLS has already dated. This is why
    the arm is extended by a rule rather than declared complete, and why the arm's
    event count is a snapshot with the date it was taken rather than a target.
  append_cadence: before_each_declared_release_instant
  append_cadence_reason: >-
    each release must be in the arm, and its rule vintage captured, before its own
    instant passes. An append made after the instant would be an append made with the
    outcome available.
  peeking_hazard: >-
    appending a release after its own outcome is known — or letting any fact about
    the release's market decide whether it is appended — would make the arm's
    membership a function of its results. Every estimate from such an arm would be
    selected on the outcome, the arm's event count would no longer be a denominator,
    and no interval computed over it would mean what it states.
  peeking_hazard_prevented_by:
    - >-
      membership is read from a published BLS calendar that BLS fixes in advance and
      this repository does not write
    - >-
      the appended release is the earliest not-yet-declared one, so the rule names the
      release without this repository choosing it
    - >-
      nothing about any contract's liveness, trading or repricing is read at
      selection time, and nothing about the release's own actual, revision or
      surprise is read at all
    - >-
      an appended release is never removed, so a disappointing release cannot be
      dropped from the denominator
    - >-
      the capture that can certify a forward window opens its interval at the instant
      the serving system states, so a capture taken after a window cannot certify it
      even by mistake; see `configs/rule_attestation_v1.yaml`
    - >-
      each append round records its own date and its own source URL per release, so a
      reader can check that a release entered the arm before its instant
  changes_after_results_are_exploratory: true

release_families:
  cpi:
    release_name: Consumer Price Index
    bls_release_key: cpi
    # The pattern carries a `{year}` placeholder rather than the fixed 2025 of the
    # retrospective arm, because this arm is open-ended in time and an append round
    # may land in a later year. Each event records the literal URL it was read from,
    # which is what an audit re-derives from.
    calendar_url_pattern: https://www.bls.gov/schedule/{year}/{month:02d}_sched_list.htm
    by_release_schedule_url: https://www.bls.gov/schedule/news_release/cpi.htm
    archive_url_pattern: https://www.bls.gov/news.release/archives/cpi_{mmddyyyy}.htm
    typical_time: "08:30:00"
    expectation_source_required: true
    expectation_gate_scope: surprise_slopes_only
    expectation_gate_meaning: >-
      A pre-release expectation source is required only before a surprise slope is
      estimated for this family. Its absence leaves every event in this file eligible for
      the event-timing study, which is defined from scheduled release time and observed
      quotes and needs no expectation source.
    event_eligibility_effect_if_expectation_absent: none
    timing_study_effect_if_expectation_absent: none
  employment:
    release_name: Employment Situation
    bls_release_key: empsit
    calendar_url_pattern: https://www.bls.gov/schedule/{year}/{month:02d}_sched_list.htm
    by_release_schedule_url: https://www.bls.gov/schedule/news_release/empsit.htm
    archive_url_pattern: https://www.bls.gov/news.release/archives/empsit_{mmddyyyy}.htm
    typical_time: "08:30:00"
    expectation_source_required: true
    expectation_gate_scope: surprise_slopes_only
    expectation_gate_meaning: >-
      A pre-release expectation source is required only before a surprise slope is
      estimated for this family. Its absence leaves every event in this file eligible for
      the event-timing study, which is defined from scheduled release time and observed
      quotes and needs no expectation source.
    event_eligibility_effect_if_expectation_absent: none
    timing_study_effect_if_expectation_absent: none

expectation_availability:
  known_expectation_source_for_these_events: unknown
  status: unresolved_until_ingestion_reports
  absence_effect_on_cohort_membership: none
  absence_effect_on_timing_study: none
  absence_effect_on_surprise_slopes: drop_that_slope_only
  fabricated_or_hindsight_expectations: prohibited

# Why this file declares events a release row cannot yet exist for.
forward_rows_do_not_exist_yet:
  statement: >-
    a release row is built from a published release page, so no row for any event in
    this file exists until that release publishes.
  row_builder: scripts/import_bls_archives.py
  row_builder_requires:
    - a captured release page whose body ends in a complete HTML document
    - the page's own embargo line to agree with the calendar's scheduled instant
    - parsed release values, without which the row is refused rather than written
  row_reader: src/market_propagation/trade_panel.py
  row_reader_requires: >-
    a sealed parquet built from those rows, verified by content hash against its
    sibling manifest, so a hand-written row is not a row
  consequence: >-
    declaring a forward event here and making it measurable are different acts. This
    file does the first. The second happens at the publication cadence, one release at
    a time.
  declares_no_release_values: true
  declares_no_observed_publication_time: true

