candidate_contract_families:
  # `configs/cohort.yaml` declares per-family lead lists here. This arm declares none
  # of its own, and that absence is stated rather than left to be read as a gap: leads
  # are unverified leads in either file (`verified_contract_ids: []` in both), and the
  # authority that turns a series name into a candidate is the v2 cohort file, which
  # both arms read.
  declared_here: false
  authority: configs/cohort_v2.yaml
  authority_keys:
    - policy_series
    - candidate_universe
    - receivers
  candidate_universe_rule: per_release_declared_listing_grid
  verified_contract_ids: []
  contract_ids_status: unverified_no_eligible_contract_verified_for_any_event
  why_no_leads_are_declared_here: >-
    a lead list written before a release exists would be an inference about which
    contracts will be listed, and this arm's whole point is that its membership is read
    from a published calendar and not guessed. The candidate universe is instead the
    declared grid, computed per release from the four declared policy series and each
    contract's own recorded listing interval, with no post-event quantity selecting it.

provenance:
  calendar_sources_read:
    - https://www.bls.gov/schedule/news_release/cpi.htm
    - https://www.bls.gov/schedule/news_release/empsit.htm
    - https://www.bls.gov/schedule/2026/10_sched_list.htm
    - https://www.bls.gov/schedule/2026/11_sched_list.htm
    - https://www.bls.gov/schedule/2026/12_sched_list.htm
  archive_url_form_verified_against:
    - https://www.bls.gov/news.release/archives/cpi_09112026.htm
    - https://www.bls.gov/news.release/archives/empsit_09042026.htm
  archive_url_form_verification_meaning: >-
    the archive path form for a 2026 release was confirmed against the two most recent
    published release pages, which state their own embargo instants and name their own
    successor's scheduled date. It is evidence about the URL form, not about any event
    in this file: no forward archive page exists yet, and each forward URL returned
    HTTP 404 when read on 2026-09-17.
  timezone_note: >-
    every monthly calendar read carries the note that all times on it are Eastern Time.
    US daylight saving ended on 2026-11-01, so the October events are UTC-04:00 and the
    November and December events are UTC-05:00. `configs/event_windows_v2.yaml` sets
    `fixed_utc_offset_allowed: false`, so each offset is carried per event rather than
    assumed for the arm.
  read_on: "2026-09-17"
