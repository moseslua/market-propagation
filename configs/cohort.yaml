candidate_contract_families:
  description: >
    Series families named by PublicIngestion as leads for downstream unresolved
    contracts. Leads are not eligible contracts. No contract, ticker, or market ID
    is verified in this file.
  cpi_linked:
    - family_key: cpi_headline_threshold
      relation_type: predictive_or_economic_exposure
      strike_dependency: announced_cpi_reading
      verified_contract_ids: []
    - family_key: cpi_core_threshold
      relation_type: predictive_or_economic_exposure
      strike_dependency: announced_core_cpi_reading
      verified_contract_ids: []
  employment_linked:
    - family_key: payrolls_threshold
      relation_type: predictive_or_economic_exposure
      strike_dependency: announced_payroll_change
      verified_contract_ids: []
    - family_key: unemployment_rate_threshold
      relation_type: predictive_or_economic_exposure
      strike_dependency: announced_unemployment_rate
      verified_contract_ids: []
  policy_linked_downstream:
    - family_key: policy_rate_decision
      relation_type: economic_exposure
      strike_dependency: later_policy_decision
      is_primary_cohort: true
      series_selection_bounds:
        max_events_per_series: 60
        max_markets_per_event_listing: 200
        bounded_walk_is_a_coverage_limit: true
      exposure_mechanism: >-
        A CPI or Employment Situation release updates the information set a later
        FOMC decision is made against, so a contract paying on that later decision
        carries economic exposure to this release. This is a stock of information,
        not a settlement relation: the release does not determine the policy
        contract's payoff, it moves the distribution over it. The exposure is
        therefore a hypothesis to be measured, never a verified equivalence between
        a release contract and a policy contract.
      observed_venue_series:
        - KXFED
        - FED
        - KXFEDDECISION
        - FEDDECISION
      candidate_venue_series: []
      observed_venue_series_evidence: >
        Read from the exchange's series listing (14013 series) on 2026-09-13. KXFED
        and FED carry title "Fed funds rate" and a Federal Reserve Board of
        Governors settlement source on the FOMC calendars page; KXFEDDECISION and
        FEDDECISION carry title "Fed meeting" and a Federal Reserve settlement
        source. FED and FEDDECISION are the legacy prefix of the same two families
        and are retained so the retired series are still reachable. A foreign
        central bank's rate-decision contract, a same-period macro contract, a Fed
        personnel vote and a Fed mention are not this family.
      verified_contract_ids: []
      contract_ids_status: unverified_no_eligible_contract_verified_for_any_event
    - family_key: recession_or_growth_threshold
      relation_type: economic_exposure
      strike_dependency: later_macro_outcome
      is_primary_cohort: false
      observed_venue_series: []
      candidate_venue_series: []
      verified_contract_ids: []
      contract_ids_status: not_enumerated_no_observed_series

excluded_from_post_release_quote_response:
  cohort_id: direct_resolution
  basis: sampled_direct_contracts_closed_before_release_time
  observed_pre_release_close_offsets:
    - observed_venue_series: KXCPI
      observed_close_time_et: "08:25:00"
      minutes_before_release: 5
      observation_origin: PublicDataScout_peer_report_2026_09_13
      observation_status: feasibility_evidence_not_a_result
    - observed_venue_series: KXPAYROLLS
      observed_close_time_et: "08:29:00"
      minutes_before_release: 1
      observation_origin: PublicDataScout_peer_report_2026_09_13
      observation_status: feasibility_evidence_not_a_result
  note: >
    This closes the question of whether post-release quote movement can be measured
    for these direct contracts. It does not establish any response magnitude.

expected_markets:
  contract_count: null
  contract_count_status: unknown_until_ingestion_completes
  direct_vs_downstream_share: null
  share_status: unknown_until_ingestion_completes
  baseline_quote_availability: null
  availability_status: unknown_until_ingestion_completes

data_unknowns:
  - which contracts were open and valid at each of the ten event times
  - observed publication times from archived payloads
  - intraday quote spacing available from historical endpoints
  - whether any point-in-time expectation source is available for the ten events
  - whether any exact cross-venue match passes the rule checklist

