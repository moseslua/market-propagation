# The ten historical release events for the study cohort, January through May 2025.
# Dates come from the official BLS release calendars for January, February, March,
# April, and May 2025, read 13 September 2026. Each calendar states that all times
# are Eastern Time.
# scheduled_at is the scheduled release time in the source calendar timezone.
# scheduled_at_utc is the same instant after America/New_York conversion.
# No eligible market ID is recorded here. Candidate series are leads only.
# PublicIngestion owns all market and endpoint discovery.

cohort:
  cohort_id: core_2025h1
  description: five CPI and five Employment Situation releases, January through May 2025
  family_separation: cpi_and_employment_estimated_separately
  event_count: 10
  event_count_by_family:
    cpi: 5
    employment: 5
  selection_basis: first_five_monthly_releases_of_2025_with_official_calendars_read
  selected_without_reference_to_outcomes: true
  verified_eligible_market_ids: []
  verified_eligible_market_id_count: 0
  cross_venue_verified_matches: []
  cross_venue_match_status: unverified_polymarket_access_timed_out
  paid_spend_usd: 0

release_families:
  cpi:
    release_name: Consumer Price Index
    bls_release_key: cpi
    calendar_url_pattern: https://www.bls.gov/schedule/2025/{month:02d}_sched_list.htm
    archive_url_pattern: https://www.bls.gov/news.release/archives/cpi_{mmddyyyy}.htm
    typical_time: "08:30:00"
    expectation_source_required: true
    expectation_gate_scope: surprise_slopes_only
    expectation_gate_meaning: >-
      A pre-release expectation source is required only before a surprise slope is
      estimated for this family. Its absence leaves every event in this file eligible for
      the event-timing study, which is defined from scheduled release time and observed
      quotes and needs no expectation source.
    event_eligibility_effect_if_expectation_absent: none
    timing_study_effect_if_expectation_absent: none
  employment:
    release_name: Employment Situation
    bls_release_key: empsit
    calendar_url_pattern: https://www.bls.gov/schedule/2025/{month:02d}_sched_list.htm
    archive_url_pattern: https://www.bls.gov/news.release/archives/empsit_{mmddyyyy}.htm
    typical_time: "08:30:00"
    expectation_source_required: true
    expectation_gate_scope: surprise_slopes_only
    expectation_gate_meaning: >-
      A pre-release expectation source is required only before a surprise slope is
      estimated for this family. Its absence leaves every event in this file eligible for
      the event-timing study, which is defined from scheduled release time and observed
      quotes and needs no expectation source.
    event_eligibility_effect_if_expectation_absent: none
    timing_study_effect_if_expectation_absent: none

expectation_availability:
  known_expectation_source_for_these_events: unknown
  status: unresolved_until_ingestion_reports
  absence_effect_on_cohort_membership: none
  absence_effect_on_timing_study: none
  absence_effect_on_surprise_slopes: drop_that_slope_only
  fabricated_or_hindsight_expectations: prohibited

